<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station — Live Weather Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0B121E;
    --bg-panel:#121B2C;
    --bg-panel-raised:#17223A;
    --line:#233151;
    --line-soft:#1A2438;
    --amber:#F2A93B;
    --amber-dim:#7A5A26;
    --cyan:#5FD1E0;
    --cyan-dim:#2C5A63;
    --text-primary:#EAEFF7;
    --text-secondary:#8E9AB4;
    --text-faint:#5B6584;
    --red:#E2665A;
    --green:#5FBF7A;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-body);}
  body{min-height:100vh;padding:28px 20px 60px;}
  .wrap{max-width:980px;margin:0 auto;}

  /* ---------- header ---------- */
  .station-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px;
    flex-wrap:wrap;gap:16px;
  }
  .station-id{display:flex;flex-direction:column;gap:4px;}
  .station-eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;
    color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:8px;
  }
  .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(95,191,122,.6);animation:pulse 2.2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(95,191,122,.55);}
    70%{box-shadow:0 0 0 6px rgba(95,191,122,0);}
    100%{box-shadow:0 0 0 0 rgba(95,191,122,0);}
  }
  .station-title{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--text-primary);}
  .station-sub{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  #citySearch{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--text-primary);
    font-family:var(--font-body);font-size:13px;padding:9px 12px;border-radius:8px;
    width:190px;outline:none;
  }
  #citySearch::placeholder{color:var(--text-faint);}
  #citySearch:focus{border-color:var(--cyan-dim);}
  .btn{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--text-secondary);
    font-family:var(--font-mono);font-size:12px;letter-spacing:.03em;padding:9px 13px;
    border-radius:8px;cursor:pointer;transition:border-color .15s, color .15s;
  }
  .btn:hover{border-color:var(--cyan-dim);color:var(--text-primary);}
  .btn:active{transform:scale(.98);}
  #searchResults{
    position:absolute;margin-top:44px;background:var(--bg-panel-raised);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;z-index:20;
    width:220px;display:none;
  }
  #searchResults div{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line-soft);}
  #searchResults div:last-child{border-bottom:none;}
  #searchResults div:hover{background:var(--bg-panel);color:var(--cyan);}

  /* ---------- hero ---------- */
  .hero{
    display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;
  }
  @media(max-width:680px){.hero{grid-template-columns:1fr;}}
  .panel{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;
  }
  .hero-main{display:flex;flex-direction:column;justify-content:space-between;min-height:220px;}
  .hero-loc{font-family:var(--font-display);font-size:17px;font-weight:600;}
  .hero-loc-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:2px;}
  .hero-temp-row{display:flex;align-items:flex-start;gap:18px;margin:14px 0;}
  .hero-temp{font-family:var(--font-mono);font-weight:700;font-size:76px;line-height:1;color:var(--text-primary);}
  .hero-temp sup{font-size:30px;font-weight:500;color:var(--text-secondary);}
  .hero-cond{display:flex;flex-direction:column;gap:6px;padding-top:10px;}
  .hero-cond-label{font-family:var(--font-display);font-size:16px;font-weight:500;}
  .hero-cond-feel{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);}
  .hero-minmax{display:flex;gap:18px;font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);}
  .hero-minmax b{color:var(--text-primary);font-weight:600;}
  .hi{color:var(--amber);} .lo{color:var(--cyan);}

  /* ---------- compass ---------- */
  .compass-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
  .compass-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--text-faint);text-transform:uppercase;}
  .compass-readout{font-family:var(--font-mono);font-size:22px;font-weight:600;}
  .compass-readout span{color:var(--text-faint);font-size:13px;font-weight:400;}

  /* ---------- metric strip ---------- */
  .metric-strip{
    display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;
  }
  @media(max-width:680px){.metric-strip{grid-template-columns:repeat(2,1fr);}}
  .metric{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:flex;flex-direction:column;gap:8px;
  }
  .metric-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--text-faint);text-transform:uppercase;}
  .metric-value{font-family:var(--font-mono);font-size:24px;font-weight:600;}
  .metric-value span{font-size:13px;color:var(--text-secondary);font-weight:400;}
  .metric-bar{height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-top:2px;}
  .metric-bar-fill{height:100%;background:var(--cyan);border-radius:2px;}

  /* ---------- hourly chart ---------- */
  .chart-panel{margin-bottom:16px;}
  .panel-heading{
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;
  }
  .panel-heading h2{font-family:var(--font-display);font-size:15px;font-weight:600;}
  .panel-heading .tag{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

  /* ---------- forecast row ---------- */
  .forecast-row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  @media(max-width:680px){.forecast-row{grid-template-columns:repeat(4,1fr);}}
  .fday{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .fday-name{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;}
  .fday-icon{font-size:20px;}
  .fday-hi{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--amber);}
  .fday-lo{font-family:var(--font-mono);font-size:13px;color:var(--cyan);}

  .status-line{
    margin-top:22px;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  .loading, .err{
    text-align:center;padding:60px 20px;font-family:var(--font-mono);color:var(--text-faint);font-size:13px;
  }
  .err{color:var(--red);}
</style>
</head>
<body>
<div class="wrap">

  <div class="station-header">
    <div class="station-id">
      <div class="station-eyebrow"><span class="pulse-dot"></span> live station feed</div>
      <div class="station-title">Weather Monitor</div>
      <div class="station-sub" id="localTime">— — : — — : — —</div>
    </div>
    <div class="controls" style="position:relative;">
      <input type="text" id="citySearch" placeholder="Search a location…" autocomplete="off">
      <div id="searchResults"></div>
      <button class="btn" id="geoBtn" title="Use current location">◎ locate</button>
      <button class="btn" id="refreshBtn" title="Refresh now">↻ refresh</button>
    </div>
  </div>

  <div id="app">
    <div class="loading">Acquiring station signal…</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){

  const app = document.getElementById('app');
  const citySearch = document.getElementById('citySearch');
  const searchResults = document.getElementById('searchResults');
  const geoBtn = document.getElementById('geoBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const localTimeEl = document.getElementById('localTime');

  let currentLoc = { lat: 12.9716, lon: 77.5946, name: 'Bengaluru', country: 'IN' };
  let refreshTimer = null;
  let clockTimer = null;
  let tzOffsetSeconds = 0;
  let chartInstance = null;

  const WMO = {
    0:['Clear sky','☀'],1:['Mainly clear','🌤'],2:['Partly cloudy','⛅'],3:['Overcast','☁'],
    45:['Fog','🌫'],48:['Rime fog','🌫'],
    51:['Light drizzle','🌦'],53:['Drizzle','🌦'],55:['Dense drizzle','🌦'],
    56:['Freezing drizzle','🌧'],57:['Freezing drizzle','🌧'],
    61:['Light rain','🌧'],63:['Rain','🌧'],65:['Heavy rain','🌧'],
    66:['Freezing rain','🌨'],67:['Freezing rain','🌨'],
    71:['Light snow','🌨'],73:['Snow','❄'],75:['Heavy snow','❄'],77:['Snow grains','❄'],
    80:['Light showers','🌦'],81:['Showers','🌦'],82:['Violent showers','⛈'],
    85:['Snow showers','🌨'],86:['Snow showers','🌨'],
    95:['Thunderstorm','⛈'],96:['Thunderstorm, hail','⛈'],99:['Severe storm','⛈']
  };
  function wmoInfo(code){ return WMO[code] || ['Unknown',' -']; }

  function windDirLabel(deg){
    const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(deg/22.5)%16];
  }

  function updateClock(){
    if(!localTimeEl) return;
    const now = new Date(Date.now() + tzOffsetSeconds*1000);
    const hh = String(now.getUTCHours()).padStart(2,'0');
    const mm = String(now.getUTCMinutes()).padStart(2,'0');
    const ss = String(now.getUTCSeconds()).padStart(2,'0');
    localTimeEl.textContent = `${hh}:${mm}:${ss} local`;
  }

  async function geocodeSearch(query){
    if(!query || query.length<2){ searchResults.style.display='none'; return; }
    try{
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`);
      const data = await res.json();
      searchResults.innerHTML='';
      if(!data.results || data.results.length===0){ searchResults.style.display='none'; return; }
      data.results.forEach(r=>{
        const div = document.createElement('div');
        const region = r.admin1 ? `${r.admin1}, ` : '';
        div.textContent = `${r.name} — ${region}${r.country}`;
        div.addEventListener('click', ()=>{
          currentLoc = { lat:r.latitude, lon:r.longitude, name:r.name, country:r.country_code || r.country };
          searchResults.style.display='none';
          citySearch.value='';
          loadWeather();
        });
        searchResults.appendChild(div);
      });
      searchResults.style.display='block';
    }catch(e){ searchResults.style.display='none'; }
  }

  let searchDebounce;
  citySearch.addEventListener('input', (e)=>{
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>geocodeSearch(e.target.value), 350);
  });
  document.addEventListener('click',(e)=>{
    if(!e.target.closest('.controls')) searchResults.style.display='none';
  });

  geoBtn.addEventListener('click', ()=>{
    if(!navigator.geolocation){ alert('Geolocation not supported by this browser.'); return; }
    geoBtn.textContent='◎ locating…';
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      currentLoc = { lat:pos.coords.latitude, lon:pos.coords.longitude, name:'Current location', country:'' };
      await reverseName(pos.coords.latitude, pos.coords.longitude);
      geoBtn.textContent='◎ locate';
      loadWeather();
    }, ()=>{
      geoBtn.textContent='◎ locate';
      alert('Could not get your location. Search a city instead.');
    });
  });

  async function reverseName(lat, lon){
    try{
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${lat.toFixed(2)}&count=1`);
    }catch(e){}
  }

  refreshBtn.addEventListener('click', loadWeather);

  async function loadWeather(){
    app.innerHTML = '<div class="loading">Pulling live readings…</div>';
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLoc.lat}&longitude=${currentLoc.lon}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,uv_index` +
        `&hourly=temperature_2m,weather_code,precipitation_probability` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max` +
        `&timezone=auto&forecast_days=7`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('Weather service returned an error.');
      const data = await res.json();
      tzOffsetSeconds = data.utc_offset_seconds || 0;
      render(data);
      clearInterval(clockTimer);
      clockTimer = setInterval(updateClock, 1000);
      updateClock();
      clearInterval(refreshTimer);
      refreshTimer = setInterval(loadWeather, 5*60*1000);
    }catch(e){
      const isNetworkErr = e instanceof TypeError;
      app.innerHTML = `<div class="err">Signal lost — could not load weather data.<br>
        ${isNetworkErr
          ? 'The request to the weather service was blocked. If you are viewing this inside a chat preview panel, download the file and open it directly in your browser instead.'
          : e.message}
      </div>`;
    }
  }

  function render(data){
    const cur = data.current;
    const [condLabel, condIcon] = wmoInfo(cur.weather_code);
    const today = data.daily;
    const humidity = cur.relative_humidity_2m;
    const pressure = Math.round(cur.pressure_msl);
    const uv = today.uv_index_max[0];
    const gust = Math.round(cur.wind_gusts_10m);
    const windSpeed = Math.round(cur.wind_speed_10m);
    const windDeg = cur.wind_direction_10m;

    app.innerHTML = `
      <div class="hero">
        <div class="panel hero-main">
          <div>
            <div class="hero-loc">${currentLoc.name}${currentLoc.country ? ', '+currentLoc.country : ''}</div>
            <div class="hero-loc-sub">${currentLoc.lat.toFixed(2)}° , ${currentLoc.lon.toFixed(2)}° — WMO code ${cur.weather_code}</div>
          </div>
          <div class="hero-temp-row">
            <div class="hero-temp">${Math.round(cur.temperature_2m)}<sup>°C</sup></div>
            <div class="hero-cond">
              <div class="hero-cond-label">${condIcon} ${condLabel}</div>
              <div class="hero-cond-feel">feels like ${Math.round(cur.apparent_temperature)}°C</div>
            </div>
          </div>
          <div class="hero-minmax">
            <span>high <b class="hi">${Math.round(today.temperature_2m_max[0])}°</b></span>
            <span>low <b class="lo">${Math.round(today.temperature_2m_min[0])}°</b></span>
            <span>precip chance <b>${today.precipitation_probability_max[0]}%</b></span>
          </div>
        </div>

        <div class="panel compass-panel">
          <div class="compass-label">Wind</div>
          <div id="compassSvg"></div>
          <div class="compass-readout">${windSpeed} <span>km/h · gust ${gust}</span></div>
        </div>
      </div>

      <div class="metric-strip">
        <div class="metric">
          <div class="metric-label">Humidity</div>
          <div class="metric-value">${humidity}<span>%</span></div>
          <div class="metric-bar"><div class="metric-bar-fill" style="width:${humidity}%"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label">Pressure</div>
          <div class="metric-value">${pressure}<span>hPa</span></div>
          <div class="metric-bar"><div class="metric-bar-fill" style="width:${Math.min(100, Math.max(0,(pressure-980)/(1040-980)*100))}%"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label">UV index</div>
          <div class="metric-value">${uv}<span>${uv<3?'low':uv<6?'moderate':uv<8?'high':'extreme'}</span></div>
          <div class="metric-bar"><div class="metric-bar-fill" style="width:${Math.min(100, uv/11*100)}%;background:var(--amber)"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label">Wind direction</div>
          <div class="metric-value">${windDirLabel(windDeg)}<span>${Math.round(windDeg)}°</span></div>
          <div class="metric-bar"><div class="metric-bar-fill" style="width:${(windDeg/360)*100}%"></div></div>
        </div>
      </div>

      <div class="panel chart-panel">
        <div class="panel-heading">
          <h2>Next 24 hours</h2>
          <span class="tag">temperature · °C</span>
        </div>
        <div style="position:relative;height:200px;">
          <canvas id="hourlyChart" role="img" aria-label="Line chart of forecast temperature for the next 24 hours">24-hour temperature forecast chart.</canvas>
        </div>
      </div>

      <div class="panel-heading" style="margin-bottom:10px;">
        <h2>7-day outlook</h2>
        <span class="tag">${data.timezone}</span>
      </div>
      <div class="forecast-row" id="forecastRow"></div>

      <div class="status-line">
        <span>updated ${new Date().toLocaleTimeString()}</span>
        <span>auto-refresh every 5 min</span>
        <span>source: open-meteo.com</span>
      </div>
    `;

    drawCompass(windDeg);
    drawHourlyChart(data.hourly, tzOffsetSeconds);
    renderForecast(today);
  }

  function drawCompass(deg){
    const el = document.getElementById('compassSvg');
    const size = 120;
    el.innerHTML = `
      <svg width="${size}" height="${size}" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="#233151" stroke-width="1.5"/>
        <circle cx="60" cy="60" r="38" fill="none" stroke="#1A2438" stroke-width="1"/>
        <text x="60" y="14" text-anchor="middle" fill="#5B6584" font-family="JetBrains Mono" font-size="10">N</text>
        <text x="112" y="64" text-anchor="middle" fill="#5B6584" font-family="JetBrains Mono" font-size="10">E</text>
        <text x="60" y="112" text-anchor="middle" fill="#5B6584" font-family="JetBrains Mono" font-size="10">S</text>
        <text x="8" y="64" text-anchor="middle" fill="#5B6584" font-family="JetBrains Mono" font-size="10">W</text>
        <g transform="rotate(${deg} 60 60)">
          <polygon points="60,16 66,60 60,50 54,60" fill="#F2A93B"/>
          <polygon points="60,104 66,60 60,70 54,60" fill="#5FD1E0"/>
        </g>
        <circle cx="60" cy="60" r="4" fill="#EAEFF7"/>
      </svg>
    `;
  }

  function drawHourlyChart(hourly, offsetSec){
    const nowUtcSeconds = Date.now()/1000;
    let nowIdx = hourly.time.findIndex(t => (new Date(t+'Z').getTime()/1000) > nowUtcSeconds - 1800);
    if(nowIdx < 0) nowIdx = 0;
    const start = nowIdx;
    const labels = hourly.time.slice(start, start+24).map(t=>{
      const localMs = new Date(t+'Z').getTime() + offsetSec*1000;
      const localHour = new Date(localMs).getUTCHours();
      return String(localHour).padStart(2,'0')+':00';
    });
    const temps = hourly.temperature_2m.slice(start, start+24);

    if(chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('hourlyChart');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          data: temps,
          borderColor: '#5FD1E0',
          backgroundColor: 'rgba(95,209,224,0.08)',
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointHoverBackgroundColor: '#5FD1E0',
          tension: 0.35,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display:false }, tooltip: {
          backgroundColor:'#17223A', titleColor:'#8E9AB4', bodyColor:'#EAEFF7',
          borderColor:'#233151', borderWidth:1, padding:8,
          callbacks:{ label: (c)=> c.parsed.y+'°C' }
        }},
        scales: {
          x: { ticks:{ color:'#5B6584', font:{family:'JetBrains Mono',size:10}, maxRotation:0, autoSkip:true, maxTicksLimit:8 }, grid:{ display:false } },
          y: { ticks:{ color:'#5B6584', font:{family:'JetBrains Mono',size:10} }, grid:{ color:'#1A2438' } }
        }
      }
    });
  }

  function renderForecast(daily){
    const row = document.getElementById('forecastRow');
    row.innerHTML='';
    daily.time.forEach((t, i)=>{
      const [label, icon] = wmoInfo(daily.weather_code[i]);
      const d = new Date(t+'T00:00:00');
      const dayName = i===0 ? 'Today' : d.toLocaleDateString(undefined,{weekday:'short'});
      const div = document.createElement('div');
      div.className='fday';
      div.innerHTML = `
        <div class="fday-name">${dayName}</div>
        <div class="fday-icon">${icon}</div>
        <div class="fday-hi">${Math.round(daily.temperature_2m_max[i])}°</div>
        <div class="fday-lo">${Math.round(daily.temperature_2m_min[i])}°</div>
      `;
      row.appendChild(div);
    });
  }

  loadWeather();
})();
</script>
</body>
</html>
